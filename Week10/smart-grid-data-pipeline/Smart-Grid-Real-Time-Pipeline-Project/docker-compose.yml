# ============================================================================
# Smart Grid Real-Time Pipeline
# ============================================================================
# Architecture: NiFi → Kafka (3 Brokers) → NiFi Consumer → HDFS
# Kafka Cluster: 3 Brokers with 1 ZooKeeper node (dev environment)
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Apache NiFi
  # --------------------------------------------------------------------------
  # NiFi is the main data ingestion and routing engine.
  # It reads CSV files, chunks them, transforms them to JSON,
  # and publishes to Kafka topics.
  # --------------------------------------------------------------------------
  nifi:
    image: apache/nifi:latest
    container_name: nifi
    hostname: nifi

    ports:
      - "8443:8443"

    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: admin12345678
      NIFI_WEB_HTTPS_HOST: '0.0.0.0'

    volumes:
      # NiFi Internal Repositories
      - ./nifi/conf:/opt/nifi/nifi-current/conf
      - ./nifi/drivers:/opt/nifi/nifi-current/drivers
      - ./nifi/extensions:/opt/nifi/nifi-current/nar_extensions
      - ./nifi/database_repo:/opt/nifi/nifi-current/database_repository
      - ./nifi/flowfile_repo:/opt/nifi/nifi-current/flowfile_repository
      - ./nifi/content_repo:/opt/nifi/nifi-current/content_repository
      - ./nifi/provenance_repo:/opt/nifi/nifi-current/provenance_repository

      # Hadoop Config Access (Read-Only)
      - ./hadoop/config:/opt/hadoop/config:ro

      # Shared Data Directories
      - ./nifi_data:/data

      # Incoming Generated Files from Python Generator
      - ./data_ingestion/output:/data/incoming

    networks:
      - data_network

    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - namenode


  # --------------------------------------------------------------------------
  # Hadoop NameNode
  # --------------------------------------------------------------------------
  # The NameNode manages the file system namespace and regulates
  # access to files by clients. It maintains the file system tree
  # and metadata for all files and directories.
  # --------------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs_namenode
    hostname: namenode

    environment:
      CLUSTER_NAME: smart_grid_cluster

    env_file:
      - ./hadoop.env

    ports:
      - "9870:9870"
      - "9000:9000"

    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./hadoop/config:/opt/hadoop/config:ro

    networks:
      - data_network


  # --------------------------------------------------------------------------
  # Hadoop DataNode
  # --------------------------------------------------------------------------
  # The DataNode stores actual data blocks in HDFS.
  # It serves read and write requests from clients.
  # --------------------------------------------------------------------------
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs_datanode
    hostname: datanode

    environment:
      SERVICE_PRECONDITION: "namenode:9870"

    env_file:
      - ./hadoop.env

    volumes:
      - hadoop_datanode:/hadoop/dfs/data

    depends_on:
      - namenode

    networks:
      - data_network


  # --------------------------------------------------------------------------
  # Zookeeper
  # --------------------------------------------------------------------------
  # Single ZooKeeper node is sufficient for a 3-broker dev cluster.
  # In production, use 3 or 5 nodes for quorum-based HA.
  # --------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper
    hostname: zookeeper

    ports:
      - "2181:2181"

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

    networks:
      - data_network


  # --------------------------------------------------------------------------
  # Apache Kafka Cluster (3 Brokers)
  # --------------------------------------------------------------------------
  # Each broker connects to the single ZooKeeper instance.
  # 
  # Listener Design:
  #   - INTERNAL (19092/19093/19094): Inter-broker + internal Docker clients
  #   - EXTERNAL (9092/9093/9094):    Mapped to host for external access
  #   - HOST (29092/29093/29094):     Localhost access from host machine
  # --------------------------------------------------------------------------
  kafka1:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka1
    hostname: kafka1

    ports:
      - "9092:9092"      # EXTERNAL: mapped to host
      - "29092:29092"    # HOST: localhost access

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://kafka1:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka1_data:/var/lib/kafka/data

    depends_on:
      - zookeeper

    networks:
      - data_network


  kafka2:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka2
    hostname: kafka2

    ports:
      - "9093:9093"      # EXTERNAL: mapped to host
      - "29093:29093"    # HOST: localhost access

    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19093,EXTERNAL://0.0.0.0:9093,HOST://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:19093,EXTERNAL://kafka2:9093,HOST://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka2_data:/var/lib/kafka/data

    depends_on:
      - zookeeper

    networks:
      - data_network


  kafka3:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka3
    hostname: kafka3

    ports:
      - "9094:9094"      # EXTERNAL: mapped to host
      - "29094:29094"    # HOST: localhost access

    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19094,EXTERNAL://0.0.0.0:9094,HOST://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:19094,EXTERNAL://kafka3:9094,HOST://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka3_data:/var/lib/kafka/data

    depends_on:
      - zookeeper

    networks:
      - data_network


  # --------------------------------------------------------------------------
  # Kafka UI
  # --------------------------------------------------------------------------
  # Web interface to monitor topics, partitions, messages, and brokers.
  # 
  # IMPORTANT: Uses INTERNAL listeners (19092/19093/19094) because Kafka UI
  # runs inside the same Docker network. EXTERNAL ports (9092/9093/9094)
  # are reserved for host-machine access only.
  # --------------------------------------------------------------------------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: smart_grid_cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19092,kafka2:19093,kafka3:19094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

    depends_on:
      - kafka1
      - kafka2
      - kafka3

    networks:
      - data_network


# ============================================================================
# Docker Volumes (Persistent Storage)
# ============================================================================
volumes:
  hadoop_namenode:
  hadoop_datanode:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  zookeeper_data:
  zookeeper_log:


# ============================================================================
# Docker Network
# ============================================================================
networks:
  data_network:
    driver: bridge