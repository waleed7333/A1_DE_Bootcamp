# Spark runs in one container only and uses local threads, not a master/worker cluster.
spark.master                                      local[2]
# One modest job at a time keeps the engine below its 2.5GB Docker limit.
spark.driver.memory                               1600m
spark.executor.memory                             1600m
spark.sql.session.timeZone                        UTC
spark.sql.extensions                              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.ecommerce                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.ecommerce.type                  jdbc
spark.sql.catalog.ecommerce.uri                   jdbc:postgresql://postgres:5432/ecommerce
spark.sql.catalog.ecommerce.jdbc.user             ecommerce_user
spark.sql.catalog.ecommerce.warehouse             s3://ecommerce-lakehouse/warehouse
spark.sql.catalog.ecommerce.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.ecommerce.s3.endpoint           http://minio:9000
spark.sql.catalog.ecommerce.s3.path-style-access  true
spark.sql.catalog.ecommerce.s3.region             us-east-1
# Small local dataset: avoid creating 200 shuffle tasks for every operation.
spark.sql.shuffle.partitions                    4
spark.default.parallelism                       2